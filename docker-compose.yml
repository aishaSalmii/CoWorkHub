services:
  db:
    image: postgres:17
    container_name: coworkhub-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: coworkhub
      POSTGRES_USER: coworkhub_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - coworkhub_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworkhub_user -d coworkhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: coworkhub-backend
    restart: unless-stopped

    # Start the backend only after the database is healthy
    depends_on:
      db:
        condition: service_healthy

    # Inside Docker the database host is the service name "db", not localhost
    environment:
      DB_URL: jdbc:postgresql://db:5432/coworkhub
      DB_USER: coworkhub_user
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "8080:8080"

volumes:
  coworkhub_data: