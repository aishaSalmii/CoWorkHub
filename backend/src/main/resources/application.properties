spring.application.name=coworkhub

# PostgreSQL database connection
# Values come from environment variables; the part after ':' is the default
# used when the variable is not set (running locally without Docker).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coworkhub}
spring.datasource.username=${DB_USER:coworkhub_user}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Boot server
server.port=8080